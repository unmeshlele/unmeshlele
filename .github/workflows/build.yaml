name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      # Try the personal key first: it can count private repositories too.
      # If it has expired, fall back to the built-in key (public repositories
      # only) so the daily build never fails. Renew ACCESS_TOKEN to restore
      # the full numbers.
      - name: Update SVG files (personal key)
        id: full
        continue-on-error: true
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python today.py
      - name: Update SVG files (built-in key, public repositories only)
        if: steps.full.outcome == 'failure'
        env:
          ACCESS_TOKEN: ${{ github.token }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: python today.py
      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name "GitHub-Actions-Bot"
          git commit -m "Updated profile stats" -a || echo "No changes to commit"
          git push
